resources:
  jobs:
    hello_world_job:
      name: hello_world_job
      tasks:
        - task_key: hello_world_task
          notebook_task:
            notebook_path: ../src/hello_world.py
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
