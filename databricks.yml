# This is a Declarative Automation Bundle definition for Databricks.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: Databricks

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a71fb473-f648.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-a71fb473-f648.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
